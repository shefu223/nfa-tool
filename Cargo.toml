[package]
name = "shefu223-nfa"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "nfa"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.55"
base64 = "0.22"
crc32fast = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls"] }
# Local, non-destructive Steam checks (token validity + CS2 rank scrape). No proxies, no shop API.
steam-vent = { git = "https://codeberg.org/steam-vent/steam-vent.git", rev = "b0e40109dd7a1b5101e1546ed27f62663dbe5c4b" }
steam-vent-proto = "0.5"
tokio = { version = "1", features = ["sync"] }
regex = "1"
urlencoding = "2"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Security_Cryptography",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
]

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
