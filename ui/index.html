<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NFA Loader</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <div class="glow glow-a"></div>
    <div class="glow glow-b"></div>

    <header class="header" data-tauri-drag-region>
      <div class="brand-mark" data-tauri-drag-region>
        <img src="assets/brand/logo.png" alt="" data-tauri-drag-region />
      </div>
      <div class="brand-text" data-tauri-drag-region>
        <div class="brand-title" data-tauri-drag-region>NFA Loader</div>
        <div class="brand-sub" data-tauri-drag-region>shefu223.shop</div>
      </div>
      <div class="header-fill" data-tauri-drag-region></div>
      <span id="acct-count" class="count" data-tauri-drag-region>0 accounts</span>
      <button id="settings-btn" class="hbtn" title="Settings" aria-label="Settings"><span data-icon="settings" data-size="17"></span></button>
      <span class="hsep" data-tauri-drag-region></span>
      <button id="min-btn" class="wbtn" title="Minimize" aria-label="Minimize"><span data-icon="minus" data-size="15"></span></button>
      <button id="close-btn" class="wbtn wclose" title="Close" aria-label="Close"><span data-icon="x" data-size="15"></span></button>
    </header>

    <main class="content">
      <div id="admin-banner" class="admin-banner hidden">
        <span class="ab-icon" data-icon="alert" data-size="16"></span>
        <div class="ab-text">
          <div class="ab-title">Not running as admin</div>
          <div class="ab-sub">Logging in can fail. Restart the loader as admin to be safe.</div>
        </div>
        <button id="admin-restart" class="btn btn-soft-red btn-sm">Restart as admin</button>
      </div>

      <section class="add-row">
        <label class="field">
          <span class="field-icon" data-icon="plus" data-size="15"></span>
          <input id="add-input" type="text" spellcheck="false" autocomplete="off"
                 placeholder="Paste an account here, like username----token" />
        </label>
        <button id="add-btn" class="btn btn-primary">Add account</button>
      </section>

      <section class="toolbar" id="toolbar">
        <label class="search">
          <span class="search-icon" data-icon="search" data-size="14"></span>
          <input id="search" type="text" spellcheck="false" autocomplete="off" placeholder="Search accounts" />
          <button id="search-clear" class="search-clear hidden" title="Clear search" aria-label="Clear search"><span data-icon="x" data-size="13"></span></button>
        </label>
        <div id="check-status" class="check-status"></div>
        <button id="refresh-all" class="tbtn" title="Check every account again">
          <span class="tbtn-icon" data-icon="refresh" data-size="14"></span>
          <span class="tbtn-label">Refresh all</span>
        </button>
      </section>

      <section class="grid-wrap" id="grid-wrap">
        <div id="account-grid" class="account-grid"></div>
        <div id="empty-state" class="empty hidden">
          <div class="empty-mark"><img src="assets/brand/logo.png" alt="" /></div>
          <div class="empty-title">No accounts yet</div>
          <div class="empty-sub">Paste a line above, like username----token, and press Add account.</div>
        </div>
        <div id="no-results" class="empty hidden">
          <div class="empty-title">No matches</div>
          <div class="empty-sub" id="no-results-sub"></div>
        </div>
      </section>

      <footer class="footer">
        <button id="logout-btn" class="fbtn"><span data-icon="logout" data-size="14"></span>Log out of Steam</button>
        <span class="footer-fill"></span>
        <button id="clear-steam-btn" class="fbtn"><span data-icon="eraser" data-size="14"></span>Clear Steam</button>
        <button id="clear-all-btn" class="fbtn fbtn-danger"><span data-icon="trash" data-size="14"></span>Remove all</button>
      </footer>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <div id="modal-backdrop" class="backdrop hidden">
      <div id="modal" class="modal" role="dialog" aria-modal="true"></div>
    </div>
  </div>

  <template id="card-tpl">
    <article class="card" tabindex="0">
      <div class="card-head">
        <div class="avatar">
          <img class="avatar-img" alt="" loading="lazy" decoding="async" />
          <span class="avatar-fallback" data-icon="user" data-size="22"></span>
          <span class="state-dot"></span>
        </div>
        <div class="card-id">
          <div class="name-row">
            <span class="card-name"></span>
            <span class="active-pill hidden">Active</span>
          </div>
          <div class="card-sid"></div>
        </div>
        <button class="card-more" data-action="menu" title="More" aria-label="More options"><span data-icon="more" data-size="16"></span></button>
      </div>

      <div class="rank-panel"></div>

      <div class="status-row">
        <span class="token-badge"><i class="tdot"></i><span class="tlabel"></span></span>
        <span class="chips"></span>
      </div>

      <div class="card-foot">
        <span class="warranty"></span>
        <button class="btn-login" data-action="login"></button>
        <button class="btn-eye" data-action="token" title="View token" aria-label="View token"><span data-icon="eye" data-size="15"></span></button>
      </div>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
