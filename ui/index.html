<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NFA Loader</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <div class="glow glow-a"></div>
    <div class="glow glow-b"></div>
    <div class="glow glow-c"></div>

    <header class="titlebar" data-tauri-drag-region>
      <span class="tb-title" data-tauri-drag-region>NFA&nbsp;Loader</span>
      <div class="tb-controls">
        <button id="min-btn" class="tb-btn" title="Minimize">&#x2212;</button>
        <button id="close-btn" class="tb-btn tb-close" title="Close">&#x2715;</button>
      </div>
    </header>

    <main class="content">
      <section class="brand">
        <img id="logo" class="brand-logo" src="logo.png" alt="logo" />
        <div class="brand-text">
          <h1>NFA Loader</h1>
          <a class="brand-sub">shefu223.shop</a>
        </div>
        <span id="acct-count" class="pill pill-count">0 accounts</span>
      </section>

      <div id="admin-banner" class="admin-banner hidden">
        <div>
          <div class="ab-title">Not running as Administrator</div>
          <div class="ab-sub">Logging in may fail. Restart elevated.</div>
        </div>
        <button id="admin-restart" class="btn btn-danger btn-sm">Restart as Admin</button>
      </div>

      <section class="block">
        <div class="label">ADD ACCOUNT</div>
        <div class="add-row">
          <div class="field">
            <input id="add-input" type="text" spellcheck="false" autocomplete="off"
                   placeholder="username----token" />
          </div>
          <button id="add-btn" class="btn btn-primary">Add</button>
        </div>
        <div class="hint">Long-press an account to rename or remove it.</div>
      </section>

      <section class="block grow">
        <div class="label">YOUR ACCOUNTS</div>
        <div id="account-list" class="account-list"></div>
        <div id="empty-state" class="empty hidden">
          <div class="empty-title">No accounts yet</div>
          <div class="empty-sub">Paste a line above and press Add.</div>
        </div>
      </section>

      <section class="footer">
        <div class="footer-row">
          <button id="logout-btn" class="btn btn-ghost">Log Out</button>
          <button id="clear-steam-btn" class="btn btn-ghost">Clear Steam</button>
        </div>
        <button id="clear-all-btn" class="btn btn-ghost btn-wide">Clear All Accounts</button>
      </section>
    </main>

    <div id="toast" class="toast"></div>

    <div id="sheet-backdrop" class="backdrop hidden">
      <div id="sheet" class="sheet"></div>
    </div>

    <div id="check-backdrop" class="backdrop hidden">
      <div id="check-popup" class="popup"></div>
    </div>

    <div id="update-backdrop" class="backdrop center hidden">
      <div id="update-popup" class="popup"></div>
    </div>
  </div>

  <template id="card-tpl">
    <div class="card">
      <div class="accent"></div>
      <div class="card-top">
        <div class="avatar">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8">
            <circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>
          </svg>
        </div>
        <div class="card-id">
          <div class="card-name-row">
            <span class="card-name"></span>
            <span class="pill pill-active active-pill hidden">&#x25CF; ACTIVE</span>
          </div>
          <div class="card-steamid"></div>
        </div>
        <div class="card-actions">
          <button class="btn btn-login"></button>
          <button class="btn btn-check">&#x1F50D; Check</button>
        </div>
      </div>
      <div class="card-divider"></div>
      <div class="card-bottom">
        <div class="added">
          <div class="added-label">Added</div>
          <div class="added-date"></div>
        </div>
        <div class="warranty"></div>
      </div>
    </div>
  </template>

  <script src="app.js"></script>
</body>
</html>
